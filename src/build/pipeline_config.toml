# Build-time configuration for the pipeline builders (water, basins, grid, weather, crops,
# surplus, map_overlays). Read it through src.build.config.get_config() (+ get_region_bbox)
# rather than opening this file directly.
#
# NOTE: this file holds build KNOBS only. The equal-area CRS invariant that the runtime read
# path also needs lives in src/data/crs.py as a constant (EQUAL_AREA_CRS), not here.

# ── region of interest ───────────────────────────────────────────────────────
# bbox_wgs84 is the FIXED site-discovery box (fetch_sites only). WGS84 lon/lat,
# [min_lon, min_lat, max_lon, max_lat]. Generous box around Iowa + basins reaching into
# neighbouring states. Iowa proper spans ~lon -96.65..-90.01, lat 40.33..43.59.
# covariate_bbox is DERIVED (the box enclosing every delineated basin + bbox_wgs84) and written
# here by _make_region AFTER basins are built; covariate builders read it via get_covariate_bbox().
# It is absent until the first basin build; get_covariate_bbox() falls back to bbox_wgs84.
#
# The three AOE boxes below are for the NEW pipeline (src/build2) and are read by nothing today. They define the area of interest as the union of three regions, computed from the reach network within 250 km of FLOW distance -- upstream and downstream -- of an in-situ nitrate sensor, which is the deployment reach: how far along the network from a real sensor we would place a virtual one. Derived by experiments/research/aoe-boxes, seeded from every in-situ nitrate sensor known: 234 USGS (pcodes 99133 + 99137 + 00630), 131 IWQIS and 32 MPCA, 394 of 397 snapping to a reach. They are a stored constant, not recomputed per build.
#
#   cornbelt      282 sensors, 366,879 reaches, 2.130M km2
#   ne             53 sensors,  89,428 reaches, 0.665M km2   Chesapeake + Delaware, HUC 0204-0208
#   mississippi    11 sensors,  32,573 reaches, 0.200M km2   lower Mississippi / Yazoo
#
# Seeding matters, and MPCA is why. Minnesota's continuous nitrate network reports nowhere in NWIS or WQP -- 22 of its 32 stations sit on a USGS gage, but only 2 of those publish nitrate there -- so a USGS-only seeding omits 30 corn-belt sensors and stops the region short of them. Adding it moved the cornbelt box's north edge 45.744 -> 46.921, about 130 km, and all 32 stations now fall inside.
#
# Deliberately EXCLUDED, 48 sensors: Florida (karst spring runs and EAA canals -- median nitrate 0.25 mg/L, and none of the 20 sites has ever reached the 10 mg/L MCL), the Sacramento-San Joaquin Delta (tidal, so flow direction reverses and the directed reach graph is undefined), Texas, and everything west of Colorado.
#
# cornbelt and mississippi OVERLAP in roughly lon -92.16..-89.14, lat 34.92..35.88. Consumers must union the boxes (or dedupe on grid cell / COMID) rather than summing per-box downloads.
[region]
bbox_wgs84 = [-97.6, 39.8, -89.5, 44.5]
covariate_bbox = [-100.158, 39.75, -85.839, 47.885]
cornbelt_bbox = [-100.272, 34.916, -81.192, 46.921]
ne_bbox = [-80.672, 36.684, -70.41, 43.565]
mississippi_bbox = [-92.158, 29.481, -89.144, 35.876]

# ── crops pipeline ───────────────────────────────────────────────────────────
[crops]
# Inclusive year span to attempt (CropScape covers 2000-2025 for Iowa but national coverage begins in 2008).
year_start = 2008
year_end = 2025
# Crops kept as their own column when aggregating CDL pixels onto the grid. Every CDL class
# not listed here is bucketed into "other". Names must match src/data/cdl_legend.py exactly
# (this defines the crops_global OUTPUT schema; the two live on opposite sides of the
# build/data split, so keep them in sync).
agg_crops = ["Corn", "Soybeans"]

# ── COMID-keyed static attributes ────────────────────────────────────────────
# ScienceBase items staged as COMID-keyed static basin attributes (CAT_ + TOT_ each). The builder's
# ATTR_SOURCES registry (src/build/_make_comid_attrs.py) is the code-side authority; this block
# documents the active set. Adding an attribute = one ATTR_SOURCES row + one _COMID_ATTR_COLS entry.
[comid_attrs]
sources = [
    { name = "tiles92", item = "57067469e4b03f95a075ad3e", zip = "TILES92_CONUS.zip" },  # subsurface tile drainage %, 1992
    { name = "bfi",     item = "5669a8e3e4b08895842a1d4f", zip = "BFI_CONUS.zip" },       # base-flow index %
    { name = "contact", item = "56f96fc5e4b0a6037df06b12", zip = "CONTACT_CONUS.zip" },   # subsurface contact time, days
]

# ── AgTile-US tile-drainage raster ───────────────────────────────────────────
# 30 m binary tile-drained cropland (Valayamkunnath et al. 2020, CC-BY 4.0). Single vintage 2017.
# National tif is manually downloaded to raw/agtile/national/AgTile-US.tif (14.9 GB CONUS); the
# build clips to [region].bbox_wgs84 and skips if the source is absent.
[agtile]
vintage = 2017

# ── surplus pipeline ─────────────────────────────────────────────────────────
[surplus]
# Inclusive year span of the Iowa nitrogen-surplus grid dataset.
year_start = 2000
year_end = 2017

# ── weather pipeline ─────────────────────────────────────────────────────────
# (renamed from [rain]; the rain/ package was renamed weather/.)
[weather]
# Sites whose basin overlaps the IEM data footprint by less than this fraction are skipped
# (basins extending too far outside Iowa).
coverage_threshold = 0.75

# ── map_overlays pipeline ────────────────────────────────────────────────────
[map_overlays]
# Keep NHD flowlines at or above this Strahler stream order.
min_stream_order = 3

# ── water pipeline ───────────────────────────────────────────────────────────
# The curated USGS site list lives in the water builder (USGS_SITE_LIST), not here --
# tuning it requires understanding that script's logic.
[iwqis]
sparsity_cutoff = 0.5
lifespan_cutoff = 3.92

[site_filters]
# known_bad moved to the KNOWN_BAD constant at the top of src/build/water/filter_sites.py
# (the new water build's human-review loop maintains it; it is no longer a build-config knob).
#
# big_basin STAYS here (unlike known_bad): it describes basin geometry the build already knows,
# not a human quality verdict. Consumed by src/build/water/filter_sites.py, which subtracts it from
# good_sites -> these sites get no contract row, no basin and no features. Their RAW per-site
# parquets are still downloaded and kept, so re-including one costs a
# filter_sites -> make_water -> make_features cycle with no refetch.
#
# CRITERION IS SITES CONTAINED, NOT AREA. The conflict graph joins sites that are spatially nested
# AND temporally overlapping, so one hub basin chains every sensor inside it into a single LOFO
# family. USGS-05465500 contains 38 of 127 sites at only 32k km2 -- an area rule misses it, which is
# why the original area-picked trio left the largest family at 76 sites / 60% of all rows.
# With the four below: 21 -> 31 families, largest family 76 -> 23 sites (60% -> 25% of rows), for
# 4.5% of rows given up. Next tier by containment if this needs widening: WQS0033 (22),
# WQS0115 (20), USGS-05420400 (19).
big_basin = [
    "USGS-05474500",  # contains 75 -- Mississippi R. at Keokuk
    "USGS-05465500",  # contains 38 -- Iowa R. at Wapello
    "WQS0020",        # contains 27
    "USGS-05420500",  # contains 20 -- Mississippi R. at Clinton
]
# Groundwater / karst sites: no surface drainage basin, so they can't be delineated or featured
# like a stream site (filter_sites also drops them via the is_groundwater flag). The USGS ones are
# skipped at FETCH in usgs.py to avoid a wasted pull, like big_basin. USGS-415959091441301 is the
# well (site_type=Well); the IWQIS groundwater sites (Big Spring WQS0031, etc.) never enter here.
groundwater = [
    "USGS-415959091441301",
]
