name: sustag
channels:
  - conda-forge
dependencies:
  # ── core data / modelling ──
  - python=3.12
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - xgboost
  - statsmodels
  - networkx            # basin-containment graph / LOFO split (src.splits.conflict_graph)
  # ── geospatial ──
  - geopandas
  - shapely
  - rasterio
  - pyproj
  - pyarrow
  # ── weather (gridMET NetCDF) ──
  - xarray
  - netcdf4
  # ── cloud stores (AORC hourly + NWM retrospective, both zarr on anonymous S3) ──
  # Imported at call time rather than module load (see acquire/nwm.py), so their absence does not break
  # an import -- it silently disables the fetch instead. Declare them or the next environment build
  # hits the same invisible wall.
  - zarr
  - s3fs
  # ── viz / notebooks ──
  - matplotlib
  - seaborn
  - plotly
  - pillow
  - jupyterlab
  - ipykernel
  # ── http ──
  - requests
  - pip
  - pip:
    # data-acquisition clients not reliably packaged on conda-forge
    - dataretrieval        # USGS NWIS water data
    - pygridmet            # gridMET weather (HyRiver)
    - pynhd                # USGS NLDI basin delineation (HyRiver)
    # interactive widget
    - dash
    - dash-leaflet>=1.0
    - dash-extensions       # widget map JS helpers (dash_extensions.javascript.assign)
